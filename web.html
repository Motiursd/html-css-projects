<!DOCTYPE html>
<html>
<head>
   
    <title>Motiur Rahman - Portfolio</title>
    <style> 

    body { 
     


    }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
        background-Suggest: Selection Mode
            color: #333;
            text-align: center;
            padding-bottom: 50px;
        }

        /* Navigation */
        nav {
            background-color: #008b8b;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            font-size: 18px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #adff2f;
        }

        /* Hero / Header Card */
        .card {
            background-color: #00ffff;
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.4s;
        }

        .card:hover {
            background-color: #7fffd4;
            transform: translateY(-5px);
        }

        .card h1 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .card p {
            font-size: 18px;
            margin: 8px 0;
            font-weight: 500;
        }

        /* General Headings */
        h2 {
            margin: 40px auto 20px;
            color: #005f73;
            font-size: 26px;
        }

        /* Buttons */
        .btn {
            background-color: #0000ff;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #8a2be2;
            transform: scale(1.08);
        }

        /* About Section */
        .about-text {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Services Grid */
        .services-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 900px;
            margin: 0 auto;
        }

        .services {
            background-color: white;
            width: 250px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: 0.3s;
            font-weight: bold;
        }

        .services:hover {
            background-color: #0000ff;
            color: white;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Header & Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <!-- Intro Card -->
    <div class="card">
        <h1>MY PORTFOLIO</h1>
        <p>Hello, I'm <strong>Motiur Rahman</strong></p>
        <p>Frontend Developer</p>
        <p>I Create Modern Websites</p>
    </div>

    <!-- About Section -->
    <section>
        <h2>About Me</h2>
        <p class="about-text">
            I am a CSE Student learning Web Development<br>
            and building modern websites.
        </p>
        <button class="btn">Hire Me</button>
    </section>

    <!-- Services Section -->
    <section>
        <h2>My Services</h2>
        <div class="services-container">
            <div class="services">HTML & CSS Design</div>
            <div class="services">Responsive Layouts</div>
            <div class="services">Web Development</div>
        </div>
    </section>

    <!-- Contact Section -->
    <section>
        <h2>Contact</h2>
        <button class="btn">Get In Touch</button>
    </section>

</body>
</html>
