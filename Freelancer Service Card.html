<!DOCTYPE html>
<html>

<head>

    <title>Freelancer Service Card</title>

    <style>

        body {
            background-color: lightgray;
        }

        .card {
            display: block;

            background-color: white;
            color: black;

            width: 300px;

            margin: 50px auto;
            padding: 20px;

            text-align: center;

            border-radius: 15px;

            transition: 0.4s;
        }


        .card:hover {
            background-color: lightblue;
            transform: scale(1.05);
        }


        img {
            background-color: white;

            width: 100px;
            height: 100px;

            border-radius: 50%;

            transition: 0.2s;
        }


        img:hover {
            transform: scale(1.05);
        }


        h2 { 
             
        
            color: black;

            text-align: center;

            transition: 0.4s;
        }


        h2:hover {
            color: blue;
            transform: scale(1.05);
        }


        p {
         
            color: black; 
            transition: 0.4s;
            text-align: center;
        } 

        p:hover { 
            color: blue;  
            transform: scale(1.10);

        }


        button {
            display: block;

            background-color: blue;
            color: white;

            border: none;
            border-radius: 10px;

            padding: 10px 20px;

            margin: 20px auto;

            text-align: center;

            transition: 0.4s;
        }


        button:hover {
            background-color: aquamarine;
            color: black;

            transform: scale(1.05);
        }


        @media (max-width: 600px) {

            .card {
                width: 80%;
                margin: 30px auto;
            }

        }

    </style>

</head>


<body>

    <div class="card">

        <img src="motiur.jpg" alt="Profile">

        <h2>Web Development</h2>

        <p>
            I build modern websites using HTML and CSS.
        </p>

        <p>
            Skills: HTML and CSS
        </p>

        <button>
            View Service
        </button>

    </div>

</body>

</html>
