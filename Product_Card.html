<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>

    <style>
        body {
            background-color: white;
        }

        .Card {
            width: 300px;
            text-align: center;
            background-color: white;
            color: red;
            margin: 50px auto;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px gray;
        }

        .Productname {
            background-color: blue;
            color: white;
            padding: 10px;
        }

        img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .price {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        .description {
            color: black;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
        }

        button:hover {
            background-color: darkblue;
        }

        .Card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>

<body>

    <div class="Card">

        <h1 class="Productname">Product Card</h1>

        <h2>Wireless Headphone</h2>

        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e"
             alt="Wireless Headphone">

        <p class="price">৳2,500</p>

        <p class="description">
            Our Product Best Choice
        </p>

        <button>Buy Now</button>

    </div>

</body>
</html>
